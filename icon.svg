<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f1117"/>
  <!-- Border verde -->
  <rect x="10" y="10" width="492" height="492" rx="72" fill="none" stroke="#00e676" stroke-width="5" opacity="0.35"/>

  <!-- QG: textLength garante que os dois caracteres cabem -->
  <text
    x="256" y="252"
    text-anchor="middle"
    dominant-baseline="central"
    textLength="390"
    lengthAdjust="spacingAndGlyphs"
    font-family="Courier New, Courier, monospace"
    font-weight="900"
    font-size="220"
    fill="#00e676">QG</text>

  <!-- Linha divisória -->
  <rect x="61" y="332" width="390" height="3" rx="2" fill="#00e676" opacity="0.25"/>

  <!-- Saco de dinheiro centralizado -->
  <!-- corpo -->
  <ellipse cx="256" cy="430" rx="56" ry="48" fill="#00e676"/>
  <!-- pescoço -->
  <rect x="236" y="382" width="40" height="24" rx="9" fill="#00e676"/>
  <!-- nó -->
  <circle cx="256" cy="375" r="14" fill="#0f1117"/>
  <circle cx="256" cy="375" r="14" fill="none" stroke="#00e676" stroke-width="6"/>
  <!-- cifrão -->
  <text
    x="256" y="436"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Courier New, Courier, monospace"
    font-weight="900"
    font-size="48"
    fill="#0f1117">$</text>
</svg>
