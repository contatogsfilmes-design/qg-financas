<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="g" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f1117"/>

  <!-- Border -->
  <rect x="10" y="10" width="492" height="492" rx="72" fill="none" stroke="#00e676" stroke-width="6" opacity="0.3"/>

  <!-- QG — textLength força os dois caracteres a caberem -->
  <text
    x="256" y="290"
    text-anchor="middle"
    dominant-baseline="central"
    textLength="420"
    lengthAdjust="spacingAndGlyphs"
    font-family="'Courier New', Courier, monospace"
    font-weight="900"
    font-size="230"
    fill="#00e676"
    filter="url(#g)">QG</text>

  <!-- Linha separadora -->
  <line x1="56" y1="345" x2="456" y2="345" stroke="#00e676" stroke-width="2" opacity="0.3"/>

  <!-- Saco de dinheiro -->
  <!-- Corpo oval -->
  <ellipse cx="256" cy="428" rx="58" ry="50" fill="#00e676" opacity="0.9"/>
  <!-- Pescoço -->
  <rect x="235" y="378" width="42" height="26" rx="10" fill="#00e676"/>
  <!-- Nó (círculo com fundo escuro) -->
  <circle cx="256" cy="371" r="15" fill="#0f1117"/>
  <circle cx="256" cy="371" r="15" fill="none" stroke="#00e676" stroke-width="6"/>
  <!-- Cifrão dentro do saco -->
  <text
    x="256" y="434"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Courier New', Courier, monospace"
    font-weight="900"
    font-size="50"
    fill="#0f1117">$</text>
</svg>
